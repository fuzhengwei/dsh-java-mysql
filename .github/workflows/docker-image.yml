name: Maven Build and Docker Image CI

# 打 tag 推送时触发，例如: git tag v0.1.0 && git push origin v0.1.0
# 镜像版本号自动取 tag 去掉前缀 v，同时打 latest
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dependencies Cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: |
          mvn clean package -Dmaven.test.skip=true

      - name: Extract version from tag
        id: meta
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dsh-java-mysql-app/ActionDockerfile
          # 所需要的体系结构，可以在 Available platforms 步骤中获取所有的可用架构 https://docs.docker.com/build/building/multi-platform/
          platforms: linux/amd64
          # 打 tag 推送时直接推送镜像
          push: true
          # 同时推送到 DockerHub 和阿里云镜像库
          tags: |
            fuzhengwei/dsh-java-mysql:${{ steps.meta.outputs.VERSION }}
            fuzhengwei/dsh-java-mysql:latest
            registry.cn-hangzhou.aliyuncs.com/fuzhengwei/dsh-java-mysql:${{ steps.meta.outputs.VERSION }}
            registry.cn-hangzhou.aliyuncs.com/fuzhengwei/dsh-java-mysql:latest
